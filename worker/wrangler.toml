# 口语小站 · Cloudflare Worker（v9 · 国内友好自定义域名）
# Primary: https://kouyu-api.allovemiku.top
# Legacy:  https://kouyu-xiaozhan-api.kncrty.workers.dev
# KV: kouyu-sync

name = "kouyu-xiaozhan-api"
main = "src/index.js"
compatibility_date = "2026-10-01"

workers_dev = true

[[routes]]
pattern = "kouyu-api.allovemiku.top"
custom_domain = true

[[kv_namespaces]]
binding = "SYNC"
id = "db6288cfc0bc40539357e7406a166d99"
preview_id = "db6288cfc0bc40539357e7406a166d99"

# Workers AI — ee 教练优先走此 binding
[ai]
binding = "AI"

# 可选密钥（用 wrangler secret put，不要写进 git）
# FAMILY_SECRET — 前端请求头 X-Family-Secret
# OPENAI_API_KEY — 备用大模型
# OPENAI_MODEL — 默认 gpt-4o-mini
